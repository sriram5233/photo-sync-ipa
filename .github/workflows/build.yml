name: Build IPA

on:
  push:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project PhotoSync.xcodeproj -scheme PhotoSync -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoSync.app Payload/
          zip -r PhotoSync.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-ipa
          path: PhotoSync.ipa