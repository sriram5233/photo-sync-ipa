name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project PhotoSync.xcodeproj -scheme PhotoSync -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoSync.app Payload/
          zip -r PhotoSync.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-ipa
          path: PhotoSync.ipa
