name: PhotoSync
options:
  bundleIdPrefix: com.sriram
targets:
  PhotoSync:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: "To copy your photos to the Files app"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sriram.photosync
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
